model:
  name: nvidia/NVIDIA-Nemotron-3.5-Lightning-BF16
  trust_remote_code: true
  init_adapter: outputs/sft/checkpoints/lora_adapter_final   # warm-start from SFT

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  max_seq_len: 512
  max_prompt_len: 256
  micro_batch_size: 1
  grad_accumulation_steps: 2
  max_steps: 150
  warmup_steps: 15
  lr: 1.0e-5         # DPO typically uses lower LR than SFT
  weight_decay: 0.0
  grad_clip: 1.0
  beta: 0.1          # DPO temperature — controls KL strength
  logging_steps: 5
  save_every_n_steps: 50

data:
  pref_path: data/preferences.jsonl

output:
  run_name: dpo-from-sft
  checkpoint_dir: outputs/dpo/checkpoints
  log_dir: outputs/logs
  save_top_k: 2