model:
  name: nvidia/NVIDIA-Nemotron-3.5-Lightning-BF16
  trust_remote_code: true
  use_qlora: true          # Base model loaded in 4-bit NF4

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  max_seq_len: 512
  micro_batch_size: 1
  grad_accumulation_steps: 2   # smaller than SFT so ~150 steps finish in ~4h
  max_steps: 150
  warmup_steps: 15
  val_every_n_steps: 25
  val_batches: 20
  lr: 2.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16-mixed
  overfit_batches: 0

data:
  train_path: data/train.jsonl
  val_path: data/val.jsonl
  use_chat_template: true

output:
  run_name: qlora-r8-lr2e4
  checkpoint_dir: outputs/qlora/checkpoints
  log_dir: outputs/logs
  save_top_k: 2
  save_last: true