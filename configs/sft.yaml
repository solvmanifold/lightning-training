model:
  name: nvidia/NVIDIA-Nemotron-3.5-Lightning-BF16
  trust_remote_code: true

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  max_seq_len: 512
  micro_batch_size: 1
  grad_accumulation_steps: 8
  max_steps: 500
  warmup_steps: 50
  val_every_n_steps: 50
  val_batches: 20
  lr: 2.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16-mixed
  overfit_batches: 0

data:
  train_path: data/train.jsonl
  val_path: data/val.jsonl
  use_chat_template: true

output:
  run_name: sft-r8-lr2e4
  checkpoint_dir: outputs/sft/checkpoints
  log_dir: outputs/logs
  save_top_k: 3
  save_last: true