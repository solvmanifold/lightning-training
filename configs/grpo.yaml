model:
  name: nvidia/NVIDIA-Nemotron-3.5-Lightning-BF16
  trust_remote_code: true
  init_adapter: outputs/sft/checkpoints/lora_adapter_final   # warm-start from SFT

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  micro_batch_size: 1
  grad_accumulation_steps: 2
  max_steps: 100        # RL is slow — fewer steps
  max_prompts: 300      # subset of train.jsonl used for GRPO rollouts
  warmup_steps: 10
  lr: 5.0e-6            # RL usually needs a small LR
  weight_decay: 0.0
  grad_clip: 1.0
  beta: 0.04            # KL penalty vs reference policy
  num_generations: 4    # K samples per prompt (group size)
  max_prompt_len: 256
  max_completion_len: 256
  temperature: 0.9
  logging_steps: 5
  save_every_n_steps: 25

data:
  train_path: data/train.jsonl

output:
  run_name: grpo-from-sft
  checkpoint_dir: outputs/grpo/checkpoints
  log_dir: outputs/logs
  save_top_k: 2