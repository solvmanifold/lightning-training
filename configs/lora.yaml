model:
  # BF16 base checkpoint for Nemotron 3.5 Lightning (dense model)
  name: nvidia/NVIDIA-Nemotron-3.5-Lightning-BF16
  trust_remote_code: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # Nemotron 3.5 Lightning: dense transformer - attention + MLP projections
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  max_seq_len: 4096
  micro_batch_size: 1
  # effective batch = micro_batch_size * grad_accumulation_steps
  grad_accumulation_steps: 8
  max_steps: 2000
  warmup_steps: 100
  val_every_n_steps: 200
  val_batches: 20
  lr: 2.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16-mixed     # bf16-mixed | 16-mixed | 32

data:
  train_path: data/train.jsonl
  val_path: data/val.jsonl
  # Chat template applied by prepare.py; set to null to use raw text fields
  use_chat_template: true

output:
  run_name: lightning-lora-sft
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  save_top_k: 2
  save_last: true