name: lightning-config-lab
base_config: configs/sft.yaml

# Tiers answer different questions. Smoke checks imports and one optimizer step;
# overfit confirms gradient flow; compare uses a fixed token budget so sequence
# length and batching changes are measured on approximately equal work.
tiers:
  smoke:
    training:
      max_seq_len: 256
      micro_batch_size: 4
      grad_accumulation_steps: 1
      max_steps: 3
      token_budget: 0
      warmup_steps: 0
      val_every_n_steps: 1
      val_batches: 1
      overfit_batches: 1
      seed: 42
    data:
      train_path: data/smoke.jsonl
      val_path: data/smoke.jsonl

  overfit:
    training:
      max_seq_len: 256
      micro_batch_size: 4
      grad_accumulation_steps: 1
      max_steps: 50
      token_budget: 0
      warmup_steps: 5
      val_every_n_steps: 10
      val_batches: 1
      overfit_batches: 1
      seed: 42
    data:
      train_path: data/smoke.jsonl
      val_path: data/smoke.jsonl

  compare:
    training:
      max_seq_len: 512
      micro_batch_size: 1
      grad_accumulation_steps: 2
      max_steps: 10000       # safety ceiling; token_budget is the real stop
      token_budget: 250000
      scheduler_steps: 1500
      warmup_steps: 10
      val_every_n_steps: 50
      val_batches: 10
      overfit_batches: 0
      seed: 42
    data:
      train_path: data/train.jsonl
      val_path: data/val.jsonl

experiments:
  - id: r4-attn
    description: Low-rank attention-only baseline
    lora:
      r: 4
      alpha: 8
      target_modules: [q_proj, k_proj, v_proj, o_proj]

  - id: r8-attn
    description: Medium-rank attention-only baseline
    lora:
      r: 8
      alpha: 16
      target_modules: [q_proj, k_proj, v_proj, o_proj]

  - id: r8-attn-mlp
    description: Attention plus MLP projections
    lora:
      r: 8
      alpha: 16
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

  - id: r16-attn-mlp
    description: Higher-rank attention plus MLP projections
    lora:
      r: 16
      alpha: 32
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

  - id: r8-attn-mlp-low-lr
    description: Learning-rate sensitivity control
    lora:
      r: 8
      alpha: 16
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    training:
      lr: 5.0e-5

  - id: qlora-r8-attn-mlp
    description: NF4 base with the standard r8 attention+MLP adapter
    model:
      use_qlora: true
    lora:
      r: 8
      alpha: 16
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]